{% extends "base.html" %}

{% block body %}
<main class="auth-page">
  <section class="auth-card">
    <div class="auth-brand">Disaster Watch</div>
    <h1 class="auth-title">Reset Password</h1>
    <p class="auth-sub">Set a new password for your account.</p>

    <form method="post" action="{{ url_for('auth.reset_password_post', token=token) }}" class="auth-form" novalidate>
      <label class="auth-label" for="password">New Password</label>
      <input class="auth-input" id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required />

      <label class="auth-label" for="confirm_password">Confirm Password</label>
      <input class="auth-input" id="confirm_password" name="confirm_password" type="password" minlength="8" placeholder="Re-enter new password" required />

      <button id="resetBtn" class="auth-btn" type="submit" disabled>Update Password</button>
    </form>

    <div class="auth-links">
      <a href="{{ url_for('auth.login') }}">Back to Login</a>
    </div>
  </section>
</main>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
