{% extends "base.html" %}

{% block body %}
<main class="auth-page">
  <section class="auth-card">
    <div class="auth-brand">Disaster Watch</div>
    <h1 class="auth-title">Forgot Password</h1>
    <p class="auth-sub">Enter your email and we’ll generate a reset link (valid for 1 hour).</p>

    <form method="post" action="{{ url_for('auth.forgot_password_post') }}" class="auth-form" novalidate>
      <label class="auth-label" for="email">Email</label>
      <input class="auth-input" id="email" name="email" type="email" placeholder="Enter your email" required />
      <button id="forgotBtn" class="auth-btn" type="submit" disabled>Send Reset Link</button>
    </form>

    <div class="auth-links">
      <a href="{{ url_for('auth.login') }}">Back to Login</a>
    </div>
  </section>
</main>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
